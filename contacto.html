 <section>
    <h2>Contáctanos</h2>

    <p>
        ¿Tienes un proyecto en mente? En Prisma queremos
        escucharte. Completa el siguiente formulario y nuestro
        equipo se pondrá en contacto contigo.
    </p>

<form action="https://forminit.com/f/gpwu6yvzzu6"
      method="POST"
      enctype="application/x-www-form-urlencoded">

    <label for="nombre">Nombre completo:</label>
    <input type="text"
           id="nombre"
           name="fi-sender-fullName"
           required>

    <label for="correo">Correo electrónico:</label>
    <input type="email"
           id="correo"
           name="fi-sender-email"
           required>

    <label for="asunto">Asunto:</label>
    <input type="text"
           id="asunto"
           name="fi-text-asunto"
           required>

    <label for="mensaje">Mensaje:</label>
    <textarea id="mensaje"
              name="fi-text-mensaje"
              required></textarea>

    <button type="submit">Enviar mensaje</button>

</form>
</section>
    </section>
